version: '3.8'

services:
  mongodb:
    image: mongo:7-alpine
    container_name: ecommerce-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ecommerce
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/ecommerce --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      MONGODB_URI: mongodb://admin:password@mongodb:27017/ecommerce?authSource=admin
      FRONTEND_URL: http://localhost:5173
      # Signs admin session tokens. Generate a real one for any shared deployment:
      #   openssl rand -base64 48
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-only-insecure-secret-change-me}
      ADMIN_TOKEN_TTL: 8h
      ADMIN_ORIGIN: http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  mongodb_data: